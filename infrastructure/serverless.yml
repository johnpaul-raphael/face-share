service: faceshare-lambda
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 128
  timeout: 30
  environment:
    AWS_DYNAMODB_TABLE_NAME: FaceShareData
    REKOGNITION_COLLECTION_ID: faceshare-collection
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'faceshare-events'}
    SQS_QUEUE_URL: !Ref PhotoProcessingQueue
    SECRET_KEY: ${env:SECRET_KEY}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    CORS_ORIGINS: ${env:CORS_ORIGINS, '*'}
    ENVIRONMENT: production

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${env:S3_BUCKET_NAME, 'faceshare-events'}/*"
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/FaceShareData"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/FaceShareData/index/*"
        - Effect: Allow
          Action:
            - rekognition:IndexFaces
            - rekognition:SearchFacesByImage
            - rekognition:DetectFaces
            - rekognition:DeleteFaces
            - rekognition:CreateCollection
            - rekognition:ListFaces
          Resource: "*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: !GetAtt PhotoProcessingQueue.Arn
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource: "arn:aws:ssm:${self:provider.region}:*:parameter/faceshare/*"

plugins:
  - serverless-python-requirements
  - serverless-offline

custom:
  pythonRequirements:
    pythonBin: python
    dockerizePip: false
    slim: false
    fileName: ../backend/requirements.txt

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.gitignore'
    - '!README.md'
    - '!package.json'
    - '!package-lock.json'
    - '!handler.py'
    - '!cors.json'
    - '!lifecycle.json'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!venv/**'
    - '!tests/**'

functions:
  # FastAPI backend (all REST API routes)
  # lambda_handler.py and app/ are copied from ../backend/ by CI before deploy
  api:
    handler: lambda_handler.handler
    memorySize: 256
    timeout: 30
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

  # Index face into Rekognition (called directly by confirm-upload API)
  indexFace:
    handler: lambda/index_face.lambda_handler
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /faces/index
          method: post

  # Trigger: Queue photo on S3 upload (any image type under events/)
  queuePhoto:
    handler: lambda/queue_photo.lambda_handler
    memorySize: 128
    timeout: 5
    events:
      - s3:
          bucket: ${env:S3_BUCKET_NAME, 'faceshare-events'}
          event: s3:ObjectCreated:*
          rules:
            - prefix: events/
          existing: true

  # Worker: Process photos from queue
  processPhoto:
    handler: lambda/process_photo.lambda_handler
    memorySize: 512
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt PhotoProcessingQueue.Arn
          batchSize: 10

resources:
  Resources:
    PhotoProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: faceshare-processing-queue-${self:provider.stage}
        VisibilityTimeout: 300
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PhotoProcessingDLQ.Arn
          maxReceiveCount: 3

    PhotoProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: faceshare-processing-dlq-${self:provider.stage}

  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/'

    ProcessingQueueUrl:
      Description: SQS Queue URL for photo processing
      Value: !Ref PhotoProcessingQueue
