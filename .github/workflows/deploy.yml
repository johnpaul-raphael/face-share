name: CI/CD Pipeline

on:
  # 100% manual — trigger whenever ready to deploy (CI + deploy in one run)
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      deploy_backend:
        description: "Deploy backend (service)?"
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: "Deploy frontend (UI)?"
        required: true
        default: true
        type: boolean

# Least-privilege: restrict default token to read-only
permissions:
  contents: read

env:
  STAGE: ${{ github.event.inputs.environment }}

jobs:
  # ─── Job 1: Backend lint + tests ──────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_backend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt flake8

      - name: Lint
        run: flake8 backend/app/ --max-line-length=120 --extend-ignore=E501,W503

      - name: Test
        run: pytest backend/ -v
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_DYNAMODB_TABLE_NAME: ${{ secrets.AWS_DYNAMODB_TABLE_NAME }}

  # ─── Job 2: Frontend lint + typecheck ─────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npm run typecheck

  # ─── Job 3: Deploy backend ────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Lambda)
    runs-on: ubuntu-latest
    needs: [backend-ci]
    if: github.event.inputs.deploy_backend == 'true'
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Serverless Framework
        run: npm install -g serverless@3.38.0

      - name: Install Serverless plugins
        run: npm cache clean --force && npm install
        working-directory: infrastructure

      - name: Deploy
        # Reference $SERVERLESS_STAGE as a shell variable (not ${{ }}) to prevent script injection
        run: serverless deploy --stage "$SERVERLESS_STAGE"
        working-directory: infrastructure
        env:
          SERVERLESS_STAGE: ${{ env.STAGE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

  # ─── Job 4: Deploy frontend to Vercel ─────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.event.inputs.deploy_frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
