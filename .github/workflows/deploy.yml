name: CI/CD Pipeline

on:
  # Auto-deploy on merge to develop (always dev stage)
  push:
    branches: [develop]

  # Manual deploy with environment choice
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      deploy_backend:
        description: "Deploy backend?"
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: "Deploy frontend?"
        required: true
        default: true
        type: boolean

# Least-privilege: restrict default token to read-only
permissions:
  contents: read

# Resolve the stage: manual runs use the input, auto runs always use 'dev'
env:
  STAGE: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # ─── Job 1: Backend lint + tests ────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt flake8

      - name: Lint
        run: flake8 backend/app/ --max-line-length=120 --extend-ignore=E501,W503

      - name: Test
        run: pytest backend/ -v
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  # ─── Job 2: Frontend lint + typecheck ────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npm run typecheck

  # ─── Job 3: Deploy backend ────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Lambda)
    runs-on: ubuntu-latest
    needs: [backend-ci]
    # Use 'false' string comparison — workflow_dispatch booleans arrive as strings
    if: github.event.inputs.deploy_backend != 'false'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Serverless dependencies
        run: npm ci
        working-directory: infrastructure

      - name: Deploy
        # Reference $SERVERLESS_STAGE as a shell variable (not ${{ }}) to prevent script injection
        run: npx serverless deploy --stage "$SERVERLESS_STAGE"
        working-directory: infrastructure
        env:
          SERVERLESS_STAGE: ${{ env.STAGE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

  # ─── Job 4: Deploy frontend to Vercel ────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: github.event.inputs.deploy_frontend != 'false'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
